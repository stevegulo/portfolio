<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Slideshow Test</title>
    <style>
        :root {
            --gold: #d4af37;
            --bg: #111;
            --fg: #f5f5f5;
        }

        body {
            margin: 0;
            padding: 40px;
            background: #111;
            color: #f5f5f5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .slideshow-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .slideshow-main {
            width: 100%;
            margin-bottom: 20px;
        }

        .slideshow-main img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        .slideshow-thumbs {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .slideshow-thumbs img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s, transform 0.3s;
        }

        .slideshow-thumbs img:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .slideshow-thumbs img.active {
            opacity: 1;
            border: 2px solid var(--gold);
        }
    </style>
</head>
<body>

    <div class="slideshow-wrapper">

        <!-- Main Image -->
        <div class="slideshow-main">
            <img id="mainSlide" src="images/PICT0043.JPG" alt="">
        </div>

        <!-- Thumbnail Carousel -->
        <div class="slideshow-thumbs">
            <img src="images/PICT0043.JPG" class="thumb active" alt="">
            <img src="images/PICT9411.jpg" class="thumb" alt="">
            <img src="images/PICT9436.jpg" class="thumb" alt="">
        </div>

    </div>

    <script>
        const mainSlide = document.getElementById('mainSlide');
        const thumbs = document.querySelectorAll('.slideshow-thumbs img');

        console.log('Thumbs found:', thumbs.length);

        thumbs.forEach(thumb => {
            thumb.addEventListener('click', () => {
                mainSlide.src = thumb.src;

                thumbs.forEach(t => t.classList.remove('active'));
                thumb.classList.add('active');

                mainSlide.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
            });
        });
    </script>

</body>
</html>
